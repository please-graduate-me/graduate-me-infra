name: 인프라 설정 검사
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infra-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 검증한 Docker Compose 설치
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a
        with:
          version: v5.1.0
      - run: docker compose version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
  sync:
    name: 검사한 infra 파일만 홈서버에 수신
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infra-operation.yaml
    with:
      operation: sync
      revision: ${{ github.sha }}
    secrets: inherit

name: 수신한 infra 설정 수동 적용
on:
  workflow_dispatch:
    inputs:
      target:
        description: 새 infra 설정을 적용할 환경
        required: true
        type: choice
        options: [development, production, shared]
      revision:
        description: 홈서버에 수신된 infra 전체 커밋 SHA 40자리
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: infra-manual-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infra-operation.yaml
    with:
      operation: apply
      target: ${{ inputs.target }}
      revision: ${{ inputs.revision }}
    secrets: inherit

---
services:
  api:
    build:
      context: '../graduate-me-backend'
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm db:migrate && pnpm dev:app"
    develop:
      watch:
        - action: sync+restart
          path: '../graduate-me-backend/'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - '.next/'
            - '.git/'
            - '.env'
            - '.env.*'
            - '.agents/'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
        - action: rebuild
          path: '../graduate-me-backend/pnpm-lock.yaml'
        - action: rebuild
          path: '../graduate-me-backend/package.json'
        - action: rebuild
          path: '../graduate-me-backend/Dockerfile.dev'
  worker:
    build:
      context: '../graduate-me-backend'
      dockerfile: Dockerfile.dev
    command: pnpm dev:worker
    develop:
      watch:
        - action: sync+restart
          path: '../graduate-me-backend/'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - '.next/'
            - '.git/'
            - '.env'
            - '.env.*'
            - '.agents/'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
        - action: rebuild
          path: '../graduate-me-backend/pnpm-lock.yaml'
        - action: rebuild
          path: '../graduate-me-backend/package.json'
        - action: rebuild
          path: '../graduate-me-backend/Dockerfile.dev'
  web:
    build:
      context: '../graduate-me-frontend'
      dockerfile: Dockerfile.dev
    command: pnpm dev:app
    develop:
      watch:
        - action: sync
          path: '../graduate-me-frontend/'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - '.next/'
            - '.git/'
            - '.env'
            - '.env.*'
            - '.agents/'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
        - action: rebuild
          path: '../graduate-me-frontend/pnpm-lock.yaml'
        - action: rebuild
          path: '../graduate-me-frontend/package.json'
        - action: rebuild
          path: '../graduate-me-frontend/Dockerfile.dev'
  admin:
    build:
      context: '../graduate-me-admin'
      dockerfile: Dockerfile.dev
    command: pnpm dev:app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
    develop:
      watch:
        - action: sync
          path: '../graduate-me-admin/'
          target: '/app'
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - '.tanstack/'
            - '.git/'
            - '.env'
            - '.env.*'
            - '.agents/'
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
            - vite.config.ts
            - tsr.config.json
        - action: rebuild
          path: '../graduate-me-admin/pnpm-lock.yaml'
        - action: rebuild
          path: '../graduate-me-admin/package.json'
        - action: rebuild
          path: '../graduate-me-admin/Dockerfile.dev'
        - action: sync+restart
          path: '../graduate-me-admin/vite.config.ts'
          target: '/app/vite.config.ts'
        - action: sync+restart
          path: '../graduate-me-admin/tsr.config.json'
          target: '/app/tsr.config.json'

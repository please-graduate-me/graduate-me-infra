---
name: graduate-me-production
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: graduate_me
      POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD를 설정하세요}'
      POSTGRES_DB: graduate_me_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U graduate_me -d graduate_me_production
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - database
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    environment:
      DATABASE_URL: postgresql://graduate_me:${DB_PASSWORD:?DB_PASSWORD를 설정하세요}@db:5432/graduate_me_production
      API_PORT: '4000'
      AUTH_URL: '${AUTH_URL:?AUTH_URL을 설정하세요}'
      ADMIN_URL: '${ADMIN_APP_URL:-}'
      AUTH_SECRET: '${AUTH_SECRET:?AUTH_SECRET을 설정하세요}'
      AUTH_GOOGLE_ID: '${AUTH_GOOGLE_ID:-}'
      AUTH_GOOGLE_SECRET: '${AUTH_GOOGLE_SECRET:-}'
      ADMIN_EMAILS: '${ADMIN_EMAILS:-}'
      CLOVA_STUDIO_API_KEY: '${CLOVA_STUDIO_API_KEY:-}'
      CLOVA_TEXT_MODEL: '${CLOVA_TEXT_MODEL:-HCX-007}'
      CLOVA_IMAGE_MODEL: '${CLOVA_IMAGE_MODEL:-HCX-005}'
      CLOVA_STUDIO_BASE_URL: '${CLOVA_STUDIO_BASE_URL:-https://clovastudio.stream.ntruss.com}'
      AI_DAILY_REQUEST_LIMIT: '${AI_DAILY_REQUEST_LIMIT:-100}'
      AI_DAILY_TOKEN_LIMIT: '${AI_DAILY_TOKEN_LIMIT:-200000}'
      AI_CONCURRENT_REQUEST_LIMIT: '${AI_CONCURRENT_REQUEST_LIMIT:-2}'
      AI_PREPARATION_PAGE_LIMIT: '${AI_PREPARATION_PAGE_LIMIT:-10}'
      AI_DAILY_BUDGET_USD: '${AI_DAILY_BUDGET_USD:-0}'
      AI_NAVER_INPUT_USD_PER_MILLION: '${AI_NAVER_INPUT_USD_PER_MILLION:-}'
      AI_NAVER_OUTPUT_USD_PER_MILLION: '${AI_NAVER_OUTPUT_USD_PER_MILLION:-}'
      AI_GEMINI_INPUT_USD_PER_MILLION: '${AI_GEMINI_INPUT_USD_PER_MILLION:-}'
      AI_GEMINI_OUTPUT_USD_PER_MILLION: '${AI_GEMINI_OUTPUT_USD_PER_MILLION:-}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      database:
      edge:
        aliases:
          - production-api
    image: '${API_IMAGE:?API_IMAGE를 설정하세요}'
    platform: linux/amd64
    mem_limit: 768m
    command:
      - pnpm
      - start
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  worker:
    init: true
    environment:
      DATABASE_URL: postgresql://graduate_me:${DB_PASSWORD:?DB_PASSWORD를 설정하세요}@db:5432/graduate_me_production
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GEMINI_MODEL: '${GEMINI_MODEL:-gemini-3.8-flash}'
      YOUTUBE_API_KEY: '${YOUTUBE_API_KEY:-}'
      CLOVA_STUDIO_API_KEY: '${CLOVA_STUDIO_API_KEY:-}'
      CLOVA_TEXT_MODEL: '${CLOVA_TEXT_MODEL:-HCX-007}'
      CLOVA_IMAGE_MODEL: '${CLOVA_IMAGE_MODEL:-HCX-005}'
      CLOVA_STUDIO_BASE_URL: '${CLOVA_STUDIO_BASE_URL:-https://clovastudio.stream.ntruss.com}'
      AI_DAILY_REQUEST_LIMIT: '${AI_DAILY_REQUEST_LIMIT:-100}'
      AI_DAILY_TOKEN_LIMIT: '${AI_DAILY_TOKEN_LIMIT:-200000}'
      AI_CONCURRENT_REQUEST_LIMIT: '${AI_CONCURRENT_REQUEST_LIMIT:-2}'
      AI_PREPARATION_PAGE_LIMIT: '${AI_PREPARATION_PAGE_LIMIT:-10}'
      AI_DAILY_BUDGET_USD: '${AI_DAILY_BUDGET_USD:-0}'
      AI_NAVER_INPUT_USD_PER_MILLION: '${AI_NAVER_INPUT_USD_PER_MILLION:-}'
      AI_NAVER_OUTPUT_USD_PER_MILLION: '${AI_NAVER_OUTPUT_USD_PER_MILLION:-}'
      AI_GEMINI_INPUT_USD_PER_MILLION: '${AI_GEMINI_INPUT_USD_PER_MILLION:-}'
      AI_GEMINI_OUTPUT_USD_PER_MILLION: '${AI_GEMINI_OUTPUT_USD_PER_MILLION:-}'
    networks:
      - database
      - egress
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    image: '${API_IMAGE:?API_IMAGE를 설정하세요}'
    platform: linux/amd64
    mem_limit: 768m
    command:
      - pnpm
      - start:worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    environment:
      API_INTERNAL_URL: http://production-api:4000
      ADMIN_APP_URL: '${ADMIN_APP_URL:-}'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      edge:
        aliases:
          - production-web
    image: '${WEB_IMAGE:?WEB_IMAGE를 설정하세요}'
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres_data: {}
networks:
  database:
    internal: true
  edge:
    name: graduate-me-production-edge
    external: true
  egress: {}

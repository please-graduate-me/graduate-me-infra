---
name: graduate-me-shared
services:
  gateway:
    image: '${CADDY_IMAGE:-caddy:2-alpine}'
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    environment:
      PRODUCTION_DOMAIN: '${PRODUCTION_DOMAIN:?PRODUCTION_DOMAIN을 설정하세요}'
      DEVELOPMENT_API_DOMAIN: '${DEVELOPMENT_API_DOMAIN:?DEVELOPMENT_API_DOMAIN을 설정하세요}'
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - production-edge
      - development-edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
  processor:
    init: true
    environment:
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      QRUQ_WHISPER: '${QRUQ_WHISPER:-}'
      YOUTUBE_API_KEY: '${YOUTUBE_API_KEY:-}'
      YOUTUBE_DATA_API_v3: '${YOUTUBE_DATA_API_v3:-}'
      YTDLP_COOKIES_FILE: '${YTDLP_COOKIES_FILE:-}'
      YTDLP_EXTRACTOR_ARGS: '${YTDLP_EXTRACTOR_ARGS:-}'
      PROCESSOR_API_TOKEN: '${PROCESSOR_API_TOKEN:?PROCESSOR_API_TOKEN을 설정하세요}'
      PROCESSOR_CONCURRENCY: '${PROCESSOR_CONCURRENCY:-1}'
    networks:
      - development-processing
      - production-processing
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    image: '${PROCESSOR_IMAGE:?PROCESSOR_IMAGE를 설정하세요}'
    platform: linux/amd64
    mem_limit: 3g
    cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data: {}
  caddy_config: {}
networks:
  development-edge:
    name: graduate-me-development-edge
  production-edge:
    name: graduate-me-production-edge
  development-processing:
    name: graduate-me-development-processing
  production-processing:
    name: graduate-me-production-processing

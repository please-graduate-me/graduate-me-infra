---
name: graduate-me-shared
services:
  gateway:
    image: '${CADDY_IMAGE:-caddy:2-alpine}'
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    environment:
      PRODUCTION_DOMAIN: '${PRODUCTION_DOMAIN:?PRODUCTION_DOMAIN을 설정하세요}'
      ADMIN_DOMAIN: '${ADMIN_DOMAIN:?ADMIN_DOMAIN을 설정하세요}'
      DEVELOPMENT_API_DOMAIN: '${DEVELOPMENT_API_DOMAIN:?DEVELOPMENT_API_DOMAIN을 설정하세요}'
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - production-edge
      - development-edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
volumes:
  caddy_data: {}
  caddy_config: {}
networks:
  development-edge:
    name: graduate-me-development-edge
  production-edge:
    name: graduate-me-production-edge

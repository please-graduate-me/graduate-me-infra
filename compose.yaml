---
name: graduate-me-local
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: graduate_me
      POSTGRES_PASSWORD: graduate_me_local
      POSTGRES_DB: graduate_me
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U graduate_me -d graduate_me
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: '../graduate-me-backend'
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://graduate_me:graduate_me_local@db:5432/graduate_me
      API_PORT: '4000'
      AUTH_URL: '${AUTH_URL:-http://localhost:3000}'
      AUTH_SECRET: '${AUTH_SECRET:-}'
      AUTH_GOOGLE_ID: '${AUTH_GOOGLE_ID:-}'
      AUTH_GOOGLE_SECRET: '${AUTH_GOOGLE_SECRET:-}'
      ADMIN_EMAILS: '${ADMIN_EMAILS:-}'
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: '../graduate-me-backend'
      dockerfile: Dockerfile.worker
    init: true
    environment:
      DATABASE_URL: postgresql://graduate_me:graduate_me_local@db:5432/graduate_me
      PROCESSOR_URL: http://processor:8000
      PROCESSOR_API_TOKEN: '${PROCESSOR_API_TOKEN:?PROCESSOR_API_TOKEN을 설정하세요}'
    depends_on:
      api:
        condition: service_healthy
      processor:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: '../graduate-me-frontend'
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
  processor:
    build:
      context: '../audio-processor'
    init: true
    environment:
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      QRUQ_WHISPER: '${QRUQ_WHISPER:-}'
      YOUTUBE_API_KEY: '${YOUTUBE_API_KEY:-}'
      YOUTUBE_DATA_API_v3: '${YOUTUBE_DATA_API_v3:-}'
      YTDLP_COOKIES_FILE: '${YTDLP_COOKIES_FILE:-}'
      YTDLP_EXTRACTOR_ARGS: '${YTDLP_EXTRACTOR_ARGS:-}'
      PROCESSOR_API_TOKEN: '${PROCESSOR_API_TOKEN:?PROCESSOR_API_TOKEN을 설정하세요}'
      PROCESSOR_CONCURRENCY: '${PROCESSOR_CONCURRENCY:-1}'
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
    name: '${LOCAL_POSTGRES_VOLUME:-graduate-me-local_postgres_data}'
